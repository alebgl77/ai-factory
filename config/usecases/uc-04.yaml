id: uc-04
code: UC-04
name: { en: "Job application pre-screening (fictional)", fr: "Présélection de candidatures (fictif)" }
description:
  en: >-
    Gives recruiters a reasoned ranking of the applications against the job criteria. High-risk
    AI system (Annex III, point 4(a)). No automated decision: every proposal is reviewed by a
    human. Personal data (C3) processed on the local GPU only. The upgrade of the local model to
    2026-10 requires a new review (bias testing). Fictional data.
  fr: >-
    Propose aux recruteurs un classement argumenté des candidatures au regard des critères du
    poste. Système à haut risque (annexe III, point 4 a). Aucune décision automatique : chaque
    proposition est revue par un humain. Données personnelles (C3) traitées uniquement sur le GPU
    local. La mise à niveau du modèle local 2026-10 impose une nouvelle revue (tests de biais).
    Données fictives.
