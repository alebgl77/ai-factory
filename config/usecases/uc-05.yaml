name: { en: "Loan application completeness check (fictional)", fr: "Contrôle de complétude des dossiers de prêt (fictif)" }
description:
  en: >-
    Checks that the supporting documents of a loan application are present and legible, and
    flags what is missing to the loan officer. Falls within the area of Annex III, point 5(b),
    but with a documented Art. 6(3)(a) derogation: narrow procedural task, no creditworthiness
    assessment, no profiling. Financial data (C3): local GPU only. Fictional data.
  fr: >-
    Vérifie la présence et la lisibilité des pièces justificatives d'un dossier de prêt et
    signale les manques à l'instructeur. Relève du domaine de l'annexe III, point 5 b), mais
    dérogation art. 6(3) a) documentée : tâche procédurale étroite, aucune appréciation de
    solvabilité, aucun profilage. Données financières (C3) : GPU local uniquement. Données fictives.
