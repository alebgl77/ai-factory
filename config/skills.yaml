rnd:
  # R&D Lab benches X1..X3. Stages: explore | prototype | evaluate | transfer | stopped.
  # gpu_hours = local GPU hours per month. No experiment fine-tunes or retrains a model:
  # the levers are prompts, retrieval, routing, decoding and evaluation.
  experiments:
    - id: x-01
      stage: prototype
      owner: p10
      bench: X1
      linked_usecase: uc-03
      gpu_hours: 38
      started: 2026-09-14
      next_review: 2026-11-19
      title: { en: "Adaptive routing to small models", fr: "Routage adaptatif vers petits modèles" }
      hypothesis:
        en: "A difficulty-based router sends 70% of triage requests to chat-small while losing no more than 1 F1 point"
        fr: "Un routeur par difficulté envoie 70 % des demandes de tri vers chat-small sans perte de F1 > 1 point"
      transfer_criteria:
        en: "Macro F1 ≥ 0.92 on gs-triage-v4, cost per request -60%, no red-team regression"
        fr: "F1 macro ≥ 0,92 sur gs-triage-v4, coût par requête -60 %, aucune régression red team"
    - id: x-02
      stage: evaluate
      owner: p03
      bench: X2
      linked_usecase: uc-01
      gpu_hours: 22
      started: 2026-08-31
      next_review: 2026-11-12
      title: { en: "RAG context compression", fr: "Compression de contexte RAG" }
      hypothesis:
        en: "Summarizing the retrieved passages cuts input tokens by 35% at equal faithfulness"
        fr: "Résumer les passages récupérés réduit de 35 % les tokens d'entrée à fidélité égale"
      transfer_criteria:
        en: "faithfulness ≥ 0.88 and answer_relevancy ≥ 0.85 on gs-procedures-v5, input tokens -30%"
        fr: "faithfulness ≥ 0,88 et answer_relevancy ≥ 0,85 sur gs-procedures-v5, tokens d'entrée -30 %"
    - id: x-03
      stage: explore
      owner: p09
      bench: X3
      linked_usecase: uc-04
      gpu_hours: 45
      started: 2026-10-05
      next_review: 2026-12-03
      title: { en: "Local LLM judge for C3/C4 data", fr: "Juge LLM local pour données C3/C4" }
      hypothesis:
        en: "A judge running on the local GPU reaches a kappa agreement ≥ 0.8 with human annotation"
        fr: "Un juge exécuté sur le GPU local atteint un accord kappa ≥ 0,8 avec l'annotation humaine"
      transfer_criteria:
        en: "Cohen's kappa ≥ 0.8 on 300 annotated cases, < 10 GPU hours per week"
        fr: "kappa de Cohen ≥ 0,8 sur 300 cas annotés, < 10 h GPU par semaine"
    - id: x-04
      stage: explore
      owner: p10
      bench: X3
      linked_usecase: uc-01
      gpu_hours: 6
      started: 2026-10-19
      next_review: 2026-12-03
      title: { en: "Early detection of query drift", fr: "Détection précoce de dérive des requêtes" }
      hypothesis:
        en: "The distance of the query embedding centroid signals a hit-rate drop 7 days in advance"
        fr: "La distance du centroïde d'embeddings des requêtes annonce une baisse du hit rate 7 jours avant"
      transfer_criteria:
        en: "Alert ≥ 7 days in advance on 3 replayed incidents, fewer than one false alert per month"
        fr: "Alerte ≥ 7 jours avant sur 3 incidents rejoués, moins d'une fausse alerte par mois"
    - id: x-05
      stage: transfer
      owner: p08
      linked_usecase: uc-01
      gpu_hours: 4
      started: 2026-06-08
      next_review: 2026-11-26
      title: { en: "Semantic cache in the LLM gateway", fr: "Cache sémantique dans la passerelle LLM" }
      hypothesis:
        en: "A semantic cache serves 25% of repeated requests without degrading relevance"
        fr: "Un cache sémantique sert 25 % des requêtes répétées sans dégrader la pertinence"
      transfer_criteria:
        en: "Cache hit rate ≥ 25%, answer_relevancy unchanged within ±0.01, invalidation on every reindexing"
        fr: "Taux de cache ≥ 25 %, answer_relevancy inchangée à ±0,01, invalidation à chaque réindexation"
      result:
        en: "Criteria met: handover to the platform team in progress"
        fr: "Critères atteints : transfert à l'équipe plateforme en cours"
    - id: x-06
      stage: transfer
      owner: p05
      linked_usecase: uc-07
      gpu_hours: 30
      started: 2026-05-18
      next_review: 2026-11-26
      title: { en: "Speculative decoding on the local GPU", fr: "Décodage spéculatif sur le GPU local" }
      hypothesis:
        en: "Speculative decoding cuts p95 TTFT by 25% on chat-sensitive"
        fr: "Le décodage spéculatif réduit le TTFT p95 de 25 % sur chat-sensitive"
      transfer_criteria:
        en: "p95 TTFT -25%, identical outputs on the golden set (greedy decoding)"
        fr: "TTFT p95 -25 %, sorties identiques sur le golden set (décodage glouton)"
      result:
        en: "p95 TTFT -31%: rollout planned on vllm-local"
        fr: "TTFT p95 -31 % : activation prévue sur vllm-local"
    - id: x-07
      stage: stopped
      owner: p10
      linked_usecase: uc-02
      gpu_hours: 12
      started: 2026-04-06
      next_review: null
      title: { en: "Goodwill credits without human approval", fr: "Gestes commerciaux sans validation humaine" }
      hypothesis:
        en: "The agent can grant goodwill credits under €50 on its own"
        fr: "L'agent peut accorder seul les gestes inférieurs à 50 €"
      transfer_criteria:
        en: "Error rate < 0.5% and a favorable governance review"
        fr: "Taux d'erreur < 0,5 % et revue gouvernance favorable"
      result:
        en: "Stopped: risk deemed unacceptable (MANAGE 1.1); human approval remains mandatory"
        fr: "Arrêtée : risque jugé inacceptable (MANAGE 1.1), la validation humaine reste obligatoire"
