# SPDX-License-Identifier: MIT
# Skills Lab and R&D Lab of the Virtual AI Factory (CONTRACT section 2.7). FICTIONAL.
#
# AI Act Art. 4 as rewritten by Regulation (EU) 2026/1744: providers and deployers take
# measures to support the AI literacy of their staff and of other persons dealing with AI
# systems on their behalf, adapted to their role, the risk and the context of use. The
# rewritten text no longer requires guaranteeing a given level: this file records the
# measures (modules required per role, sessions, completions) as evidence.
# art4: true marks a module counted as an Art. 4 measure; the others are professional skills.
# formats (enum values, not translated): lab (hands-on, fictional data only), atelier (workshop),
# kata (exercise without AI), exercice (tabletop simulation).
#
# Languages (CONTRACT section 9): titles, audiences, outcomes, hypotheses, criteria and results
# are either a plain string or a mapping {en: "...", fr: "..."}. Ids, dates and numbers are
# never translated.

modules:
  - id: m-literacy-101
    hours: 3
    format: lab
    art4: true
    title: { en: "AI literacy foundations: how it works, limits, hallucinations",
             fr: "Socle maîtrise de l'IA : fonctionnement, limites, hallucinations" }
    audience: { en: "all roles", fr: "tous les rôles" }
    outcome: { en: "Recognize an unsupported answer and know when not to use AI",
               fr: "Reconnaître une réponse non étayée et savoir quand ne pas utiliser l'IA" }
  - id: m-safe-use
    hours: 1.5
    format: lab
    art4: true
    title: { en: "Safe use: C1–C4 data classes and the local GPU", fr: "Usage sûr : classes de données C1–C4 et GPU local" }
    audience: { en: "technical roles", fr: "rôles techniques" }
    outcome: { en: "Choose the chat-sensitive alias for any C3/C4 data", fr: "Choisir l'alias chat-sensitive pour toute donnée C3/C4" }
  - id: m-no-ai-kata
    hours: 2
    format: kata
    art4: true
    title: { en: "No-AI kata (anti-deskilling)", fr: "Kata sans IA (anti-déqualification)" }
    audience: { en: "roles that produce work with AI", fr: "rôles qui produisent avec l'IA" }
    outcome: { en: "Redo by hand a task delegated to AI and compare", fr: "Refaire à la main une tâche déléguée à l'IA et comparer" }
  - id: m-ai-act-iso
    hours: 2
    format: atelier
    art4: true
    title: { en: "AI Act, ISO/IEC 42001 and NIST AI RMF awareness", fr: "Sensibilisation AI Act, ISO/IEC 42001 et NIST AI RMF" }
    audience: { en: "management and architecture", fr: "pilotage et architecture" }
    outcome: { en: "Classify a risk tier and its obligations", fr: "Qualifier un niveau de risque et ses obligations" }
  - id: m-governance
    hours: 4
    format: atelier
    art4: true
    title: { en: "Governance: registry, risk review, reassessment per model version",
             fr: "Gouvernance : registre, revue de risque, réévaluation par version de modèle" }
    audience: { en: "management and governance", fr: "pilotage et gouvernance" }
    outcome: { en: "Run a complete risk review", fr: "Conduire une revue de risque complète" }
  - id: m-human-oversight
    hours: 2
    format: atelier
    art4: true
    title: { en: "Human oversight of high-risk AI systems (Art. 14 and 26)",
             fr: "Contrôle humain des systèmes à haut risque (art. 14 et 26)" }
    audience: { en: "supervisors and governance", fr: "superviseurs et gouvernance" }
    outcome: { en: "Know how to interpret, challenge and suspend an output", fr: "Savoir interpréter, contester et suspendre une sortie" }
  - id: m-agent-supervision
    hours: 3
    format: lab
    art4: true
    title: { en: "Agent supervision: escalations, kill switch, TTFT, tokens per task",
             fr: "Supervision d'agents : escalades, coupe-circuit, TTFT, tokens par tâche" }
    audience: "Agent Ops"
    outcome: { en: "Detect an agent loop and stop it", fr: "Détecter une boucle d'agent et l'arrêter" }
  - id: m-redteam
    hours: 3
    format: lab
    art4: true
    title: { en: "LLM red teaming: prompt injection, exfiltration, jailbreaks",
             fr: "Red teaming LLM : injection de prompt, exfiltration, contournement" }
    audience: { en: "technical roles", fr: "rôles techniques" }
    outcome: { en: "Write and replay a red-team campaign", fr: "Écrire et rejouer une campagne red team" }
  - id: m-bias
    hours: 2
    format: lab
    art4: true
    title: { en: "Fairness and bias: testing on fictional data", fr: "Équité et biais : tests sur données fictives" }
    audience: { en: "high-risk systems", fr: "systèmes à haut risque" }
    outcome: { en: "Measure a disparity in treatment between fictional groups", fr: "Mesurer un écart de traitement entre groupes fictifs" }
  - id: m-incident
    hours: 1.5
    format: exercice
    art4: true
    title: { en: "AI incidents: rollback, reporting (Art. 73)", fr: "Incidents IA : retour arrière, signalement (art. 73)" }
    audience: { en: "operations and management", fr: "exploitation et pilotage" }
    outcome: { en: "Walk through the serious incident runbook", fr: "Dérouler le runbook d'incident grave" }
  - id: m-rag
    hours: 4
    format: lab
    art4: false
    title: { en: "RAG: ingestion, chunking, indexing, citations", fr: "RAG : ingestion, découpage, indexation, citations" }
    audience: { en: "technical roles", fr: "rôles techniques" }
  - id: m-eval
    hours: 4
    format: lab
    art4: false
    title: { en: "Evaluation engineering: RAGAS, LLM-as-a-judge, golden sets",
             fr: "Ingénierie de l'évaluation : RAGAS, LLM-as-judge, golden sets" }
    audience: { en: "technical roles", fr: "rôles techniques" }
  - id: m-llmops
    hours: 4
    format: lab
    art4: false
    title: { en: "LLMOps: versioning, evaluation gates, automatic rollback",
             fr: "LLMOps : versionnage, portes d'évaluation, retour arrière automatique" }
    audience: { en: "platform", fr: "plateforme" }
  - id: m-finops
    hours: 2
    format: atelier
    art4: false
    title: { en: "AI FinOps: tokens, GPUs, showback and chargeback", fr: "FinOps IA : tokens, GPU, showback et chargeback" }
    audience: { en: "management and platform", fr: "pilotage et plateforme" }

