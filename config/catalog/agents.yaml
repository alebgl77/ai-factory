# SPDX-License-Identifier: MIT
# Self-service agent catalog (CONTRACT section 2.5). FICTIONAL LangGraph agents.
# risk_tier mirrors the AI Act tier computed for the linked use case (the catalog engine flags
# any mismatch). eval_status: passed | pending | failed; only "passed" agents are offered in
# self-service. Agents call models only through the LiteLLM gateway with
# metadata.usecase / metadata.agent for cost attribution, and tools only through MCP.
# name, pattern, human_in_the_loop and note are bilingual {en, fr} (CONTRACT section 9).

agents:
  - { id: ag-doc-research, framework: LangGraph, version: "1.4.0",
      owner: p03, usecase: uc-01, tools: [tl-qdrant-search, tl-citation-check], risk_tier: limited,
      eval_status: passed, model_alias: chat-default,
      name: { en: "Document research agent", fr: "Agent de recherche documentaire" },
      pattern: { en: "Agentic RAG (retrieval, query rewriting, citation)",
                 fr: "RAG agentique (récupération, reformulation, citation)" } }

  - { id: ag-support-supervisor, framework: LangGraph, version: "2.1.0",
      owner: p05, usecase: uc-02, tools: [tl-ticket-read, tl-crm-read], risk_tier: limited,
      eval_status: passed, model_alias: chat-default,
      name: { en: "Customer support supervisor", fr: "Superviseur support client" },
      pattern: { en: "Multi-agent supervisor: delegates to research, then to drafting",
                 fr: "Superviseur multi-agents : délègue à la recherche puis à la rédaction" },
      human_in_the_loop: { en: "Escalates to a human on low confidence or for any goodwill credit",
                           fr: "Escalade vers un humain si confiance faible ou geste commercial" } }

  - { id: ag-support-research, framework: LangGraph, version: "2.1.0",
