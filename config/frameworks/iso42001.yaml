# SPDX-License-Identifier: MIT
# ISO/IEC 42001:2023 - display labels of clauses 4-10 and Annex A (CONTRACT section 2.6).
# The standard is copyrighted and paywalled: identifiers were cross-checked against several
# public secondary sources and labels are short paraphrases (English and French), not the ISO
# text. Buy the standard for the authoritative wording. Sources: docs/GOVERNANCE.md.
#
# Languages (CONTRACT section 9): human-readable values are {en, fr} mappings; ids are not.

standard:
  id: iso42001
  name:
    en: "ISO/IEC 42001:2023 — Artificial intelligence management systems"
    fr: "ISO/IEC 42001:2023 — Systèmes de management de l'intelligence artificielle"
  published: 2023-12
  url: "https://www.iso.org/standard/81230.html"
  paywalled: true
  verification:
    en: "identifiers cross-checked against secondary sources (public implementation guides); labels paraphrased"
    fr: "identifiants recoupés sur sources secondaires (guides de mise en œuvre publics) ; libellés paraphrasés"
  counts: { annex_a_objectives: 9, annex_a_controls: 38 }
  other_annexes:
    - id: "B"
      label: { en: "Implementation guidance for the Annex A controls", fr: "Guide de mise en œuvre des mesures de l'annexe A" }
    - id: "C"
      label: { en: "Potential AI-related organizational objectives and risk sources", fr: "Objectifs organisationnels et sources de risque potentiels liés à l'IA" }
    - id: "D"
      label: { en: "Use of the management system across domains or sectors", fr: "Utilisation du système de management dans différents domaines ou secteurs" }

clauses:                          # harmonized structure of ISO management system standards
  - id: "4"
    label: { en: "Context of the organization", fr: "Contexte de l'organisme" }
    subclauses:
      - id: "4.1"
        label:
          en: "Understanding the organization and its context (including its role regarding AI systems)"
          fr: "Compréhension de l'organisme et de son contexte (dont son rôle vis-à-vis des systèmes d'IA)"
      - id: "4.2"
        label: { en: "Needs and expectations of interested parties", fr: "Besoins et attentes des parties intéressées" }
      - id: "4.3"
        label: { en: "Scope of the AI management system", fr: "Domaine d'application du système de management de l'IA" }
      - id: "4.4"
        label: { en: "AI management system", fr: "Système de management de l'IA" }
  - id: "5"
    label: "Leadership"
    subclauses:
      - id: "5.1"
        label: { en: "Leadership and commitment", fr: "Leadership et engagement" }
      - id: "5.2"
        label: { en: "AI policy", fr: "Politique IA" }
      - id: "5.3"
        label: { en: "Roles, responsibilities and authorities", fr: "Rôles, responsabilités et autorités" }
  - id: "6"
    label: { en: "Planning", fr: "Planification" }
    subclauses:
      - id: "6.1"
        label: { en: "Actions to address risks and opportunities", fr: "Actions face aux risques et opportunités" }
      - id: "6.1.2"
        label: { en: "AI risk assessment", fr: "Appréciation des risques liés à l'IA" }
      - id: "6.1.3"
        label: { en: "AI risk treatment (statement of applicability)", fr: "Traitement des risques liés à l'IA (déclaration d'applicabilité)" }
      - id: "6.1.4"
        label: { en: "AI system impact assessment", fr: "Évaluation de l'impact des systèmes d'IA" }
      - id: "6.2"
        label: { en: "AI objectives and planning to achieve them", fr: "Objectifs IA et planification pour les atteindre" }
      - id: "6.3"
        label: { en: "Planning of changes", fr: "Planification des modifications" }
  - id: "7"
    label: "Support"
    subclauses:
      - id: "7.1"
        label: { en: "Resources", fr: "Ressources" }
      - id: "7.2"
        label: { en: "Competence", fr: "Compétences" }
      - id: "7.3"
        label: { en: "Awareness", fr: "Sensibilisation" }
      - id: "7.4"
        label: "Communication"
      - id: "7.5"
        label: { en: "Documented information", fr: "Informations documentées" }
  - id: "8"
    label: { en: "Operation", fr: "Fonctionnement" }
    subclauses:
      - id: "8.1"
        label: { en: "Operational planning and control", fr: "Planification et maîtrise opérationnelles" }
      - id: "8.2"
        label: { en: "AI risk assessment", fr: "Appréciation des risques liés à l'IA" }
      - id: "8.3"
        label: { en: "AI risk treatment", fr: "Traitement des risques liés à l'IA" }
      - id: "8.4"
        label: { en: "AI system impact assessment", fr: "Évaluation de l'impact des systèmes d'IA" }
  - id: "9"
    label: { en: "Performance evaluation", fr: "Évaluation des performances" }
    subclauses:
      - id: "9.1"
        label: { en: "Monitoring, measurement, analysis and evaluation", fr: "Surveillance, mesure, analyse et évaluation" }
      - id: "9.2"
        label: { en: "Internal audit", fr: "Audit interne" }
      - id: "9.3"
        label: { en: "Management review", fr: "Revue de direction" }
  - id: "10"
    label: { en: "Improvement", fr: "Amélioration" }
    subclauses:
      - id: "10.1"
        label: { en: "Continual improvement", fr: "Amélioration continue" }
      - id: "10.2"
        label: { en: "Nonconformity and corrective action", fr: "Non-conformité et action corrective" }

annex_a:
  - id: "A.2"
    label: { en: "Policies related to AI", fr: "Politiques relatives à l'IA" }
    objective:
      en: "Provide direction and support for AI systems in line with the organization's requirements"
      fr: "Orienter et soutenir les systèmes d'IA selon les exigences de l'organisme"
    controls:
      - id: "A.2.2"
        label: { en: "AI policy", fr: "Politique IA" }
      - id: "A.2.3"
        label: { en: "Alignment with other organizational policies", fr: "Alignement avec les autres politiques de l'organisme" }
      - id: "A.2.4"
        label: { en: "Review of the AI policy", fr: "Revue de la politique IA" }
  - id: "A.3"
    label: { en: "Internal organization", fr: "Organisation interne" }
    objective:
      en: "Establish accountability for a responsible approach to AI systems"
      fr: "Établir les responsabilités pour une approche responsable des systèmes d'IA"
    controls:
      - id: "A.3.2"
        label: { en: "AI roles and responsibilities", fr: "Rôles et responsabilités liés à l'IA" }
      - id: "A.3.3"
        label: { en: "Reporting of concerns", fr: "Signalement des préoccupations" }
  - id: "A.4"
    label: { en: "Resources for AI systems", fr: "Ressources des systèmes d'IA" }
    objective:
      en: "Identify the resources (components and assets) needed to understand and address risks and impacts"
      fr: "Identifier les ressources (composants et actifs) pour comprendre et traiter risques et impacts"
    controls:
      - id: "A.4.2"
        label: { en: "Resource documentation", fr: "Documentation des ressources" }
      - id: "A.4.3"
        label: { en: "Data resources", fr: "Ressources de données" }
      - id: "A.4.4"
        label: { en: "Tooling resources", fr: "Ressources d'outillage" }
      - id: "A.4.5"
        label: { en: "System and computing resources", fr: "Ressources système et informatiques" }
      - id: "A.4.6"
        label: { en: "Human resources (competencies)", fr: "Ressources humaines (compétences)" }
  - id: "A.5"
    label: { en: "Assessing impacts of AI systems", fr: "Évaluation des impacts des systèmes d'IA" }
    objective:
      en: "Assess impacts on individuals, groups and society throughout the lifecycle"
      fr: "Évaluer les impacts sur les personnes, les groupes et la société sur le cycle de vie"
    controls:
      - id: "A.5.2"
        label: { en: "AI system impact assessment process", fr: "Processus d'évaluation de l'impact des systèmes d'IA" }
      - id: "A.5.3"
        label: { en: "Documentation of impact assessments", fr: "Documentation des évaluations d'impact" }
      - id: "A.5.4"
        label: { en: "Assessing impacts on individuals or groups of individuals", fr: "Évaluation de l'impact sur les personnes ou groupes de personnes" }
      - id: "A.5.5"
        label: { en: "Assessing societal impacts", fr: "Évaluation des impacts sociétaux" }
  - id: "A.6"
    label: { en: "AI system lifecycle", fr: "Cycle de vie des systèmes d'IA" }
    objective:
      en: "Responsible design and development; criteria and requirements for each lifecycle stage"
      fr: "Conception et développement responsables ; critères et exigences pour chaque étape du cycle de vie"
    controls:
      - id: "A.6.1.2"
        label: { en: "Objectives for responsible development", fr: "Objectifs de développement responsable" }
      - id: "A.6.1.3"
        label: { en: "Processes for responsible design and development", fr: "Processus de conception et de développement responsables" }
      - id: "A.6.2.2"
        label: { en: "System requirements and specification", fr: "Exigences et spécification du système" }
      - id: "A.6.2.3"
        label: { en: "Design and development documentation", fr: "Documentation de la conception et du développement" }
      - id: "A.6.2.4"
        label: { en: "Verification and validation", fr: "Vérification et validation" }
      - id: "A.6.2.5"
        label: { en: "Deployment", fr: "Déploiement" }
      - id: "A.6.2.6"
        label: { en: "Operation and monitoring", fr: "Exploitation et surveillance" }
      - id: "A.6.2.7"
        label: { en: "Technical documentation", fr: "Documentation technique" }
      - id: "A.6.2.8"
        label: { en: "Recording of event logs", fr: "Enregistrement des journaux d'événements" }
  - id: "A.7"
    label: { en: "Data for AI systems", fr: "Données des systèmes d'IA" }
    objective:
      en: "Understand the role and impact of data throughout the AI system lifecycle"
      fr: "Comprendre le rôle et l'impact des données sur le cycle de vie des systèmes d'IA"
    controls:
      - id: "A.7.2"
        label: { en: "Data for development and enhancement", fr: "Données pour le développement et l'amélioration" }
      - id: "A.7.3"
        label: { en: "Data acquisition", fr: "Acquisition des données" }
      - id: "A.7.4"
        label: { en: "Data quality", fr: "Qualité des données" }
      - id: "A.7.5"
        label: { en: "Data provenance", fr: "Provenance des données" }
      - id: "A.7.6"
        label: { en: "Data preparation", fr: "Préparation des données" }
  - id: "A.8"
    label: { en: "Information for interested parties", fr: "Informations pour les parties intéressées" }
    objective:
      en: "Give interested parties the information they need to understand and assess the risks"
      fr: "Donner aux parties intéressées les informations nécessaires pour comprendre et évaluer les risques"
    controls:
      - id: "A.8.2"
        label: { en: "System documentation and information for users", fr: "Documentation du système et informations pour les utilisateurs" }
      - id: "A.8.3"
        label: { en: "External reporting", fr: "Rapports externes" }
      - id: "A.8.4"
        label: { en: "Communication of incidents", fr: "Communication des incidents" }
      - id: "A.8.5"
        label: { en: "Information for interested parties", fr: "Informations pour les parties intéressées" }
  - id: "A.9"
    label: { en: "Use of AI systems", fr: "Utilisation des systèmes d'IA" }
    objective:
      en: "Use AI systems responsibly and in line with organizational policies"
      fr: "Utiliser les systèmes d'IA de façon responsable et conforme aux politiques"
    controls:
      - id: "A.9.2"
        label: { en: "Processes for responsible use", fr: "Processus d'utilisation responsable" }
      - id: "A.9.3"
        label: { en: "Objectives for responsible use", fr: "Objectifs d'utilisation responsable" }
      - id: "A.9.4"
        label: { en: "Intended use of the system", fr: "Utilisation prévue du système" }
  - id: "A.10"
    label: { en: "Third-party and customer relationships", fr: "Relations avec les tiers et les clients" }
    objective:
      en: "Maintain accountability and allocate risks when third parties are involved in the lifecycle"
      fr: "Rester responsable et répartir les risques quand des tiers interviennent dans le cycle de vie"
    controls:
      - id: "A.10.2"
        label: { en: "Allocation of responsibilities", fr: "Répartition des responsabilités" }
      - id: "A.10.3"
        label: { en: "Suppliers", fr: "Fournisseurs" }
      - id: "A.10.4"
        label: { en: "Customers", fr: "Clients" }
