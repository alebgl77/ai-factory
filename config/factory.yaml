# SPDX-License-Identifier: MIT
# Virtual AI Factory - global definition (CONTRACT section 2.1).
# FICTIONAL DEMO: every organization, cost center, budget and rate below is invented and
# meant to be edited. Regulatory dates are configuration, not code: check the Official
# Journal (EUR-Lex) before relying on them. Sources are listed in docs/GOVERNANCE.md.
#
# Languages (CONTRACT section 9): any human-readable value is either a plain string (same text
# in every language) or a mapping {en: "...", fr: "..."}. English is the primary language.
# Ids, enums, numbers and dates are never translated.

factory:
  name: "Virtual AI Factory"
  tagline: { en: "Generic AI factory — fictional demo", fr: "Usine IA générique — démo fictive" }
  currency: EUR
  demo: true
  fine_tuning: false          # hard guard: no fine-tuning, no retraining anywhere in the factory
  timezone: Europe/Paris

regulatory:
  ai_act:
    regulation: { en: "Regulation (EU) 2024/1689", fr: "Règlement (UE) 2024/1689" }
    amended_by:
      en: "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
      fr: "Règlement (UE) 2026/1744 (Omnibus numérique sur l'IA)"
    amendment:
      oj_reference: { en: "OJ L, 2026/1744, 24.7.2026", fr: "JO L, 2026/1744, 24.7.2026" }
      oj_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202601744"
      published: 2026-07-24
      in_force: 2026-07-27
      verification:
        en: "dates cross-checked against several secondary sources (law firms, CSA, CDT) on 2026-11-03; the Official Journal text could not be consulted from the build environment"
        fr: "dates recoupées par plusieurs sources secondaires (cabinets, CSA, CDT) le 2026-11-03 ; texte du JO non consultable depuis l'environnement de build"
    # Contract milestones (ids used by the risk engine) first, then informative milestones.
    # verified: confirmed = cross-checked by at least two concurring sources; to_verify = a single
    # source or diverging sources, to be confirmed in the Official Journal.
    milestones:
      - { id: prohibitions, date: 2025-02-02, verified: confirmed,
          label: { en: "Art. 5 prohibited AI practices", fr: "Art. 5 pratiques interdites" } }
      - { id: literacy,     date: 2025-02-02, verified: confirmed,
          label: { en: "Art. 4 AI literacy (rewritten by 2026/1744)", fr: "Art. 4 maîtrise de l'IA (réécrit par 2026/1744)" } }
      - { id: gpai,         date: 2025-08-02, verified: confirmed,
          label: { en: "Chapter V general-purpose AI (GPAI) models", fr: "Chapitre V modèles GPAI" } }
      - { id: transparency, date: 2026-08-02, verified: confirmed,
          label: { en: "Art. 50 transparency obligations", fr: "Art. 50 transparence" } }
      - { id: annex_iii,    date: 2027-12-02, verified: confirmed,
          label: { en: "High-risk AI systems, Annex III", fr: "Haut risque annexe III" } }
      - { id: annex_i,      date: 2028-08-02, verified: confirmed,
          label: { en: "High-risk AI systems, Annex I", fr: "Haut risque annexe I" } }
      - { id: omnibus_in_force, date: 2026-07-27, verified: confirmed,
          label: { en: "Entry into force of 2026/1744 (new Art. 4: measures to support AI literacy)",
                   fr: "Entrée en vigueur de 2026/1744 (nouvel art. 4 : mesures de soutien à la maîtrise de l'IA)" } }
      - { id: gpai_fines,   date: 2026-08-02, verified: confirmed,
          label: { en: "Commission fines for providers of GPAI models (Art. 101)",
                   fr: "Amendes de la Commission aux fournisseurs GPAI (art. 101)" } }
      - { id: art50_2_legacy, date: 2026-12-02, verified: confirmed,
          label: { en: "Art. 50(2) marking: end of the grace period for systems placed on the market before August 2, 2026",
                   fr: "Art. 50(2) marquage : fin du délai pour les systèmes mis sur le marché avant le 2 août 2026" } }
      - { id: new_prohibitions, date: 2026-12-02, verified: to_verify,
          label: { en: "New Art. 5 prohibitions (non-consensual intimate imagery, child sexual abuse material) added by 2026/1744",
                   fr: "Nouvelles interdictions art. 5 (images intimes non consenties, pédocriminalité) ajoutées par 2026/1744" } }
      - { id: gpai_legacy,  date: 2027-08-02, verified: confirmed,
          label: { en: "GPAI models placed on the market before August 2, 2025: compliance deadline (Art. 111(3))",
                   fr: "Modèles GPAI mis sur le marché avant le 2 août 2025 : mise en conformité (art. 111(3))" } }
      - { id: sandboxes,    date: 2027-08-02, verified: to_verify,
          label: { en: "National AI regulatory sandboxes (deadline postponed by 2026/1744)",
                   fr: "Bacs à sable réglementaires nationaux (échéance reportée par 2026/1744)" } }
  nist_ai_rmf:
    document: { en: "NIST AI 100-1 (AI RMF 1.0), January 2023", fr: "NIST AI 100-1 (AI RMF 1.0), janvier 2023" }
    profile: { en: "NIST AI 600-1 (Generative AI Profile), July 2024", fr: "NIST AI 600-1 (Generative AI Profile), juillet 2024" }
  iso42001:
    standard: "ISO/IEC 42001:2023"
    note:
      en: "paywalled standard: identifiers checked against secondary sources, labels paraphrased"
      fr: "norme payante : identifiants vérifiés sur sources secondaires, libellés paraphrasés"

# Fictional cost centers. budget_month_eur covers LLM tokens, GPU and (in chargeback mode)
# the shared platform share.
cost_centers:
  - { id: cc-ops,      budget_month_eur: 1500,
      name: { en: "Operations (fictional)", fr: "Direction des opérations (fictif)" } }
  - { id: cc-relation, budget_month_eur: 2400,
      name: { en: "Customer relations and marketing (fictional)", fr: "Relation client et marketing (fictif)" } }
  - { id: cc-rh,       budget_month_eur: 600,
      name: { en: "Human resources (fictional)", fr: "Ressources humaines (fictif)" } }
  - { id: cc-finance,  budget_month_eur: 900,
      name: { en: "Finance, legal and risk (fictional)", fr: "Finance, juridique et risques (fictif)" } }

rates:
  # Local GPU: amortized purchase + energy. 24 GB card in a workstation (indicative values).
  local_gpu: { capex_eur: 4500, amortization_months: 36, power_w: 240, kwh_eur: 0.21 }
  cloud_gpu_eur_per_hour: { h100: 2.9, l4: 0.7 }   # batch jobs (reindexing, offline evals)
  vps_eur_per_month: 40
  platform_overhead_pct: 12   # shared platform cost spread over use cases in chargeback mode

chargeback:
  mode: showback              # showback | chargeback
  shared_allocation: tokens   # tokens | equal | requests

waste_rules:
  oversized_model:  { simple_task_types: [classification, extraction, routing], premium_tier: premium }
  low_cache_hit:    { min_repeat_ratio: 0.4, max_cache_hit: 0.2 }
  retry_storm:      { max_retry_ratio: 0.05 }
  prompt_bloat:     { max_growth_pct: 30 }
  idle_gpu:         { max_util_pct: 10, min_hours: 4 }
  orphan_index:     { max_idle_days: 14 }
  eval_overspend:   { max_share_pct: 25 }
  budget_breach:    { warn_pct: 90 }

placement:
  order: [cloud, vps, local]  # preference for non-sensitive workloads
  sensitive_classes: [C3, C4] # local GPU only, never cloud or VPS (queued if the GPU is down)
  vps_max_params_b: 8         # biggest model the VPS can serve (CPU)

data_classes:                 # informative labels of the sensitivity scale
  - { id: C1, label: "Public" }
  - { id: C2, label: { en: "Internal", fr: "Interne" } }
  - { id: C3, label: { en: "Confidential (personal, HR and financial data)", fr: "Confidentiel (données personnelles, RH, financières)" } }
  - { id: C4, label: { en: "Secret (legal, strategic)", fr: "Secret (juridique, stratégique)" } }

agentops_slo: { ttft_ms_p95: 1500, vector_latency_ms_p95: 120, tokens_per_task_p95: 12000 }

eval_gates:                   # thresholds by AI Act tier (stricter when risk is higher)
  minimal: { faithfulness: 0.75, answer_relevancy: 0.75, context_precision: 0.70, judge_score: 3.5, redteam_pass: 0.90 }
  limited: { faithfulness: 0.80, answer_relevancy: 0.80, context_precision: 0.75, judge_score: 3.8, redteam_pass: 0.95 }
  high:    { faithfulness: 0.90, answer_relevancy: 0.85, context_precision: 0.85, judge_score: 4.2, redteam_pass: 0.99 }

dataloop:                     # drift thresholds of the data loop (actions never retrain a model)
  thresholds:
    retrieval_hit_rate: 0.75    # below => reindex
    corpus_freshness: 0.10      # share of documents past their refresh SLA, above => reindex
    query_drift: 0.25           # embedding centroid distance vs the eval set, above => update_eval_set
    eval_failure_cluster: 5     # failures sharing one topic, above => update_eval_set
    cost_drift: 20.0            # % cost per request increase, above => change_routing
    latency_drift: 20.0         # % p95 latency increase, above => change_routing
  # >= 2x a threshold, or a routing change on a high-risk system => human_review

rollback:
  thumbs_down_ratio_max: 2.0  # online thumbs-down rate vs pre-deploy baseline
  online_faithfulness_drop_max: 0.08
  error_rate_max: 0.05
