# Example only. Replace these groups and IdP subjects with the verified deployment mappings.
version: 1
groups:
  bu-operations: [cc-ops]
  bu-rh: [cc-rh]
  bu-finance: [cc-finance]
  bu-relation: [cc-relation]
  factory-governance-admin: ["*"]
resources:
  D1: [cc-ops]
  D2: [cc-relation]
  B1: [cc-rh]
  B2: [cc-finance]
  R1: ["*"]
secure_resources: [B1, B2]
people:
  cc-ops: [p02]
  cc-rh: [p06]
  cc-finance: [p07]
  cc-relation: [p03]
identities:
  example-oidc-ops-subject: p02
  example-oidc-hr-subject: p06
  example-oidc-finance-subject: p07
  example-oidc-relations-subject: p03
shadow_teams:
  cc-ops: [operations]
  cc-rh: [human-resources]
  cc-finance: [finance]
  cc-relation: [customer-relations, marketing]

# Optional portfolio grants. Add each of these groups to `groups` above
# with [cc-ops] and to FACTORY_ROLE_MAP with the viewer role before enabling.
# portfolio_roles:
#   bu-ops-project-leads: [project_lead]
#   bu-ops-managers: [manager]
#   bu-ops-architects: [architect]
#
# Use a stable service subject from the identity proxy. Its dedicated viewer
# group must also grant the BU of the agent's configured use case.
# portfolio_agents:
#   example-oidc-doc-agent: ag-doc-research
#
# Each unspecified mode requires a manager to authorize the agent's start.
# Sensitive preparation stops at a Workbench handoff status. Existing Workbench
# permissions and approval rules apply separately to any external action.
# portfolio_autonomy:
#   cc-ops:
#     read_only: autonomous
#     prepare: human_review
#     sensitive: blocked
