# SPDX-License-Identifier: MIT
# Team profiles of the Virtual AI Factory (CONTRACT section 2.2).
# FICTIONAL: names, skills, squads and presence patterns are invented. Any resemblance to a
# real person is coincidental. Edit freely: the dashboard and the API adapt to any count.
#
# Desks (3D resources): D1..D6 delivery floor, B1..B2 secure lab (sensitive data, local GPU),
# X1..X3 R&D Lab benches, O1..O2 Agent Ops consoles. 12 people for 13 desks (X3 is the
# shared R&D bench). Avatar colors avoid the status colors of the dashboard
# (free green, busy red, soon amber, later blue).
# pattern = demo presence Mon..Fri (1 on site, 0 remote); Thursday is the team day.
#
# Languages (CONTRACT section 9): labels, descriptions and skills are either a plain string
# (same in every language, e.g. "FinOps") or a mapping {en: "...", fr: "..."}. Person names,
# ids, colors and desks are never translated.

presence:
  team_day: 3                 # index in pattern (0 = Monday): Thursday
  note:
    en: "Thursday: team day (team rituals, risk reviews, Skills Lab)"
    fr: "Jeudi : journée d'équipe (rituels, revues de risque, Skills Lab)"

roles:
  - id: head
    label: "Head of AI Factory"
    literacy_level: expert
    description:
      en: "Arbitrates the portfolio and is accountable for risk decisions (GOVERN 2.3)"
      fr: "Arbitre le portefeuille, porte la responsabilité des décisions de risque (GOVERN 2.3)"
  - id: po
    label: { en: "AI Product Owner", fr: "Product Owner IA" }
    literacy_level: advanced
    description:
      en: "Frames value, KPIs and adoption; business owner of the use cases"
      fr: "Cadre la valeur, les KPI et l'adoption ; propriétaire métier des use cases"
  - id: architect
    label: { en: "AI and platform architect", fr: "Architecte IA et plateforme" }
    literacy_level: expert
    description:
      en: "Designs the hybrid cloud / VPS / local GPU placement and the RAG and agent patterns"
      fr: "Conçoit le placement hybride cloud / VPS / GPU local et les patrons RAG et agents"
  - id: llm_engineer
    label: { en: "LLM engineer", fr: "Ingénieur·e LLM" }
    literacy_level: expert
    description:
      en: "Builds prompts, LangGraph agents and RAG chains; no fine-tuning"
      fr: "Construit prompts, agents LangGraph et chaînes RAG ; aucun fine-tuning"
  - id: data_engineer
    label: { en: "Data engineer (ingestion and indexing)", fr: "Data engineer (ingestion et indexation)" }
    literacy_level: advanced
    description:
      en: "Ingestion, chunking, embeddings, corpus freshness, reindexing"
      fr: "Ingestion, découpage, embeddings, fraîcheur des corpus, réindexation"
  - id: eval_scientist
    label: { en: "Eval scientist (evaluation and red teaming)", fr: "Eval scientist (évaluation et red team)" }
    literacy_level: expert
    description:
      en: "Golden sets, RAGAS, LLM-as-a-judge, red teaming, bias testing"
      fr: "Golden sets, RAGAS, LLM-as-judge, red teaming, tests de biais"
  - id: llmops
    label: { en: "LLMOps engineer", fr: "Ingénieur·e LLMOps" }
    literacy_level: expert
    description:
      en: "Pipeline, LLM gateway, observability, automatic rollback, FinOps"
      fr: "Pipeline, passerelle LLM, observabilité, retour arrière automatique, FinOps"
  - id: governance
    label: { en: "AI governance and compliance lead", fr: "Responsable gouvernance IA et conformité" }
    literacy_level: expert
    description:
      en: "Registry, AI Act / NIST AI RMF / ISO/IEC 42001 risk reviews, incidents"
      fr: "Registre, revues de risque AI Act / NIST AI RMF / ISO/IEC 42001, incidents"
  - id: agent_ops
    label: { en: "Agent Ops operator", fr: "Opérateur·rice Agent Ops" }
    literacy_level: advanced
    description:
      en: "Supervises agents in production: escalations, kill switch, SLOs"
      fr: "Supervise les agents en production : escalades, coupe-circuit, SLO"
  - id: research
    label: { en: "Applied R&D researcher", fr: "Chercheur·se R&D appliquée" }
    literacy_level: expert
    description:
      en: "Runs experiments in the R&D Lab and transfers them against measurable criteria"
      fr: "Expérimente au R&D Lab et transfère selon des critères mesurables"
  - id: enablement
    label: { en: "Skills Lab lead (AI enablement)", fr: "Responsable Skills Lab (acculturation)" }
    literacy_level: advanced
    description:
      en: "Runs the Art. 4 measures: role-based learning paths, no-AI katas, sessions"
      fr: "Pilote les mesures art. 4 : parcours par rôle, katas sans IA, sessions"

