# SPDX-License-Identifier: MIT
# Opt-in v4 server rehearsal. Keep the v3 API while migrating the infrastructure.
# https://langfuse.com/self-hosting/upgrade/upgrade-guides/upgrade-v3-to-v4#perform-the-upgrade
services:
  langfuse-web:
    image: langfuse/langfuse:4.72.0@sha256:c311fd9db4b69f6514fdcb1b86a2a105d5a4ed51fbf0ded033ff2722459c804a
    environment: &langfuse-v4-env
      LANGFUSE_MIGRATION_V4_WRITE_MODE: legacy
      LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR: dual_write
      LANGFUSE_MIGRATION_V4_ALLOW_PREVIEW_OPT_IN: "false"
      LANGFUSE_BACKGROUND_MIGRATION_V4_ENABLE_HISTORIC_BACKFILL: "false"
  langfuse-worker:
    image: langfuse/langfuse-worker:4.72.0@sha256:aa1724b989a00f1e4ca9930709202489c73deaaf2f1116bbd3d71c77edb8fedb
    environment: *langfuse-v4-env
