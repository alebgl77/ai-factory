[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory-workbench"
version = "0.1.0"
description = "Governed action proposals, review, and execution for AI Factory"
requires-python = ">=3.11"
license = "MIT"
license-files = ["ai_factory_workbench/LICENSE"]
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
ai-factory-mcp = "ai_factory_workbench.mcp_server:main"

[project.urls]
Repository = "https://github.com/alebgl77/ai-factory"

[tool.setuptools.packages.find]
include = ["ai_factory_workbench*"]

[tool.setuptools.package-data]
ai_factory_workbench = ["agent_skills/*/SKILL.md"]
