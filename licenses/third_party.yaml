  - service: ollama-vps
    image: ollama/ollama
    tag: 0.40.14
    spdx: MIT
    license: MIT
    usage: separate-service
    modified: false
    profile: vps
    source: https://github.com/ollama/ollama
  - service: vllm-local
    image: vllm/vllm-openai
    tag: v0.33.0
    spdx: Apache-2.0
    license: "Apache-2.0 (CUDA libraries of the image under the NVIDIA license, not redistributed by this repository)"
    usage: separate-service
    modified: false
    profile: local-gpu
    source: https://github.com/vllm-project/vllm
  - service: dcgm-exporter
    image: nvidia/dcgm-exporter
    tag: 4.6.1-4.8.4
    spdx: Apache-2.0
    license: "Apache-2.0 (CUDA libraries of the image under the NVIDIA license, not redistributed by this repository)"
    usage: separate-service
    modified: false
    profile: local-gpu
    source: https://github.com/NVIDIA/dcgm-exporter

  # ------------------------------------------- base images (FROM lines of the repository Dockerfiles)
  - service: "api, mock-llm, traffic, gpu-sim, grafana-bootstrap (base image)"
    image: python
    tag: 3.12.16-slim
    spdx: PSF-2.0
    license: "PSF-2.0 (CPython); Debian packages of the image under their own licenses (aggregate)"
    usage: build-time
    modified: false
    source: https://github.com/docker-library/python
  - service: "dashboard (vendor stage: fetches Three.js, absent from the final image)"
    image: node
    tag: 26.13.0-alpine
    spdx: MIT
    license: "MIT (Node.js); Alpine packages of the image under their own licenses (aggregate)"
    usage: build-time
    modified: false
    source: https://github.com/nodejs/docker-node
  - service: "dashboard (nginx base image)"
    image: nginx/nginx-unprivileged
    tag: 1.31.8-alpine-slim
    spdx: BSD-2-Clause
    license: "BSD-2-Clause (nginx); Alpine packages of the image under their own licenses (aggregate)"
    usage: build-time
    modified: false
    source: https://github.com/nginx/docker-nginx-unprivileged
    note: "alpine-slim variant: nginx without the optional dynamic modules and their libraries (none is loaded by dashboard/nginx.conf). Base images are pinned by digest in the Dockerfiles."

# Third-party code embedded at build time, loaded from a pinned CDN, or vendored with provenance.
vendored:
  - name: three
    version: 0.186.1
    spdx: MIT
    license: MIT
    usage: build-time
    where: "dashboard/Dockerfile (npm pack + SRI integrity check, copied to /vendor/three); jsDelivr CDN in file:// mode"
    source: https://github.com/mrdoob/three.js
    check: {file: dashboard/Dockerfile, pattern: "ARG THREE_VERSION=([0-9.]+)"}
  - name: qrcode-generator
    version: 2.0.4
    spdx: MIT
    license: MIT
    usage: runtime
    where: "dashboard/companion/vendor/qrcode.js (pinned local copy and integrity verification)"
    source: https://github.com/kazuhikoarase/qrcode-generator
    check: {file: dashboard/companion/vendor/PROVENANCE.md, pattern: "Version: ([0-9.]+)"}
  - name: geist
    version: 1.9.1
    spdx: OFL-1.1
    license: SIL Open Font License 1.1
    usage: runtime
    where: "dashboard/companion/fonts/ (unmodified Geist and Geist Mono variable WOFF2 files with license and provenance)"
    source: https://github.com/vercel/geist-font
    check: {file: dashboard/companion/fonts/PROVENANCE.md, pattern: "Version: ([0-9.]+)"}
  - name: swagger-ui-dist
    version: 5.34.0
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: "OpenAPI page /api/v1/docs: loaded by the browser from jsDelivr, version pinned with Subresource Integrity and a per-answer CSP nonce (api/app/main.py); never distributed by this repository"
    source: https://github.com/swagger-api/swagger-ui
    check: {file: api/app/main.py, pattern: "SWAGGER_UI_VERSION = \"([0-9.]+)\""}
  - name: claude-inc-skill-vetting
    version: 3199e383aefa5f8364f3f7389d45e8c5b90b93ab
    spdx: MIT
    license: MIT
    usage: runtime
    where: "SDK analyst skill ai-factory-skill-vetting (read-only adaptation with upstream license)"
    source: https://github.com/alebgl77/claude-inc/blob/3199e383aefa5f8364f3f7389d45e8c5b90b93ab/skills/skill-vetting/SKILL.md
    check: {file: api/ai_factory_workbench/agent_skills/ai-factory-skill-vetting/SKILL.md, pattern: 'upstream-revision:\s*["\x27]?([0-9a-f]{40})'}
  - name: ecc-agent-security-hardening
    version: b38be6a7f6350964d59328b52f0624e1d1d552d1
    spdx: MIT
    license: MIT
    usage: runtime
    where: "SDK analyst skill ai-factory-agent-security-review (read-only adaptation with upstream license)"
    source: https://github.com/affaan-m/ECC/blob/b38be6a7f6350964d59328b52f0624e1d1d552d1/skills/agent-security-hardening/SKILL.md
    check: {file: api/ai_factory_workbench/agent_skills/ai-factory-agent-security-review/SKILL.md, pattern: 'upstream-revision:\s*["\x27]?([0-9a-f]{40})'}
  - name: grafana-llmops-forge-skill
    version: 491fcac4f43318e6eda16d8496912ea441bf888b
    spdx: MIT
    license: MIT
    usage: runtime
    where: "SDK analyst skill ai-factory-observability-review (read-only adaptation with upstream license)"
    source: https://github.com/alebgl77/grafana-llmops-forge/blob/491fcac4f43318e6eda16d8496912ea441bf888b/SKILL.md
    check: {file: api/ai_factory_workbench/agent_skills/ai-factory-observability-review/SKILL.md, pattern: 'upstream-revision:\s*["\x27]?([0-9a-f]{40})'}

# Verification tools (CI, scripts): never shipped in the stack images.
tools:
  - name: trivy
    image: aquasec/trivy
    tag: 0.76.1
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: ".github/workflows/security.yml and release.yml (aquasecurity/trivy-action, Apache-2.0; config in .github/trivy/); local scans with the aquasec/trivy image (compose/README.md, Image scan)"
    source: https://github.com/aquasecurity/trivy
    check: {file: .github/workflows/security.yml, pattern: "TRIVY_VERSION: v([0-9.]+)"}
  - name: syft
    version: 1.55.0
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: "SBOMs: scripts/sbom.sh, .github/workflows/security.yml and release.yml (anchore/sbom-action, Apache-2.0)"
    source: https://github.com/anchore/syft
    check: {file: scripts/sbom.sh, pattern: "anchore/syft:v([0-9.]+)@"}
  - name: cosign
    version: 3.1.4
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: "keyless signing of the release images and checksums: .github/workflows/release.yml (sigstore/cosign-installer, Apache-2.0), .github/scripts/verify_image.sh"
    source: https://github.com/sigstore/cosign
    check: {file: .github/workflows/release.yml, pattern: "COSIGN_VERSION: v([0-9.]+)"}
  - name: actionlint
    image: rhysd/actionlint
    tag: 1.7.12
    spdx: MIT
    license: MIT
    usage: build-time
    where: ".github/workflows/ci.yml (job workflows), image pinned by digest"
    source: https://github.com/rhysd/actionlint
    check: {file: .github/workflows/ci.yml, pattern: "rhysd/actionlint:([0-9.]+)@"}
  - name: zizmor
    version: 1.31.1
    spdx: MIT
    license: MIT
    usage: build-time
    where: ".github/workflows/ci.yml (job workflows), hash-pinned in .github/tools/zizmor/"
    source: https://github.com/zizmorcore/zizmor
    check: {file: .github/tools/zizmor/requirements.in, pattern: "zizmor==([0-9.]+)"}
  - name: pip-audit
    version: 2.10.1
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: ".github/workflows/security.yml (every requirement lock), hash-pinned in .github/tools/pip-audit/"
    source: https://github.com/pypa/pip-audit
    check: {file: .github/tools/pip-audit/requirements.in, pattern: "pip-audit==([0-9.]+)"}
  - name: pip-tools
    version: 7.6.2
    spdx: BSD-3-Clause
    license: BSD-3-Clause
    usage: build-time
    where: "pip-compile --generate-hashes: compiles every requirements*.in into its hash-pinned requirements*.txt lock (maintainers and Dependabot; never installed in an image)"
    source: https://github.com/jazzband/pip-tools
  - name: scorecard-action
    version: 2.5.0
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: ".github/workflows/scorecard.yml (OpenSSF Scorecard)"
    source: https://github.com/ossf/scorecard-action
    check: {file: .github/workflows/scorecard.yml, pattern: "ossf/scorecard-action@[0-9a-f]{40} # v([0-9.]+)"}
  - name: dex
    image: dexidp/dex
    tag: v2.46.1
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: "test OpenID Connect provider of compose/sso/test_sso_e2e.sh (CI job sso-e2e on manual dispatch; never part of the stack)"
    source: https://github.com/dexidp/dex
  - name: gitleaks
    image: zricethezav/gitleaks
    tag: v8.30.1
    spdx: MIT
    license: MIT
    usage: build-time
    where: "scripts/scan_secrets.sh, scripts/inventory_github.py"
    source: https://github.com/gitleaks/gitleaks
  - name: playwright
    version: 1.64.1
    spdx: Apache-2.0
    license: Apache-2.0
    usage: build-time
    where: "e2e tests (CI-only, locked with integrity hashes in .github/tools/e2e, never shipped)"
    source: https://github.com/microsoft/playwright
    check: {file: .github/tools/e2e/package.json, pattern: "\"playwright\": \"([0-9.]+)\""}

# Licenses checked by hand when the metadata of a Python package is missing or ambiguous.
python_overrides: {}
