# SPDX-License-Identifier: MIT
# Inventory of the third-party components of the Virtual AI Factory and license policy.
# Read by scripts/check_licenses.py (exit code 1 on a violation). Explanations: docs/LICENSES.md.
#
# Fields of an image:
#   image / tag   exact reference used by docker-compose.yml or a Dockerfile
#   spdx          SPDX identifier (or expression) evaluated against the policy below
#   license       human-readable label (may state a scope, e.g. "ee" modules excluded)
#   usage         separate-service: separate, unmodified container, called over the network
#                 build-time      : base image or tool used to build / check
#   modified      false: official image used as is (mandatory for AGPL)
#   source        repository of the corresponding source code
schema: 1

policy:
  # Permissive licenses compatible with an MIT repository (same list as api/app/engines/catalog.py).
  permissive: [MIT, MIT-0, MIT-CMU, HPND, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PSF-2.0, Python-2.0,
               PostgreSQL, Unlicense, CC0-1.0, Zlib, BSL-1.0]
  # Allowed under conditions (file-level weak copyleft).
  conditional:
    MPL-2.0: "file-level weak copyleft: used unmodified, upstream source code available"
    OFL-1.1: "font: redistributable with the software, never sold on its own, reserved name if modified"
  # Allowed ONLY for an unmodified "separate-service" entry (never linked, never copied).
  separate_service_only: [AGPL-3.0-only, AGPL-3.0-or-later, AGPL-3.0]
  # Denied everywhere (prefixes): strong copyleft, "source-available" and proprietary licenses.
  denied_prefixes: [GPL-, LGPL-, AGPL-, SSPL-, EUPL-, OSL-, CC-BY-SA-, BUSL-, Elastic-, RSAL, Commons-Clause, proprietary]

images:
  # ---------------------------------------------------------------- services (docker-compose.yml)
  - service: "edge, volume-init (one-shot chown of the edge volumes, same image)"
    image: caddy
    tag: 2.11.7-alpine
    spdx: Apache-2.0
    license: Apache-2.0
    usage: separate-service
    modified: false
    source: https://github.com/caddyserver/caddy
  - service: prometheus
    image: prom/prometheus
    tag: v3.15.1
    spdx: Apache-2.0
    license: Apache-2.0
    usage: separate-service
    modified: false
    source: https://github.com/prometheus/prometheus
  - service: grafana
    image: grafana/grafana
    tag: 13.0.12
    spdx: AGPL-3.0-only
    license: "AGPL-3.0 (OSS edition: separate service, unmodified official image, queried through its HTTP API)"
    usage: separate-service
    modified: false
    source: https://github.com/grafana/grafana
    note: "grafana/grafana is the OSS image (LICENSE file of the image: GNU AGPL v3); grafana/grafana-oss received no release after 13.0.2."
  - service: loki
    image: grafana/loki
    tag: 3.7.9
    spdx: AGPL-3.0-only
    license: "AGPL-3.0 (separate service, unmodified official image, fed by Alloy)"
    usage: separate-service
    modified: false
    source: https://github.com/grafana/loki
  - service: alloy
    image: grafana/alloy
    tag: v1.21.3
    spdx: Apache-2.0
    license: Apache-2.0
    usage: separate-service
    modified: false
    source: https://github.com/grafana/alloy
  - service: qdrant
    image: qdrant/qdrant
    tag: v1.20.0-unprivileged
    spdx: Apache-2.0
    license: Apache-2.0
    usage: separate-service
    modified: false
    source: https://github.com/qdrant/qdrant
  - service: litellm
    image: litellm/litellm-non_root
    tag: v1.106.7
    spdx: MIT
    license: "MIT (enterprise/ excluded, no license key)"
    usage: separate-service
    modified: false
    source: https://github.com/BerriAI/litellm
    note: "Official non-root variant (runs as nobody). No LITELLM_LICENSE variable: the features of the enterprise/ directory (commercial license) stay inactive. The factory_callbacks.py callback is MIT code from this repository, mounted read-only. LITELLM_IMAGE may select the root image litellm/litellm of the same release."
  - service: docker-socket-proxy
    image: wollomatic/socket-proxy
    tag: 1.13.2
    spdx: MIT
    license: "MIT (image label: MIT AND Apache-2.0)"
    usage: separate-service
    modified: false
    source: https://github.com/wollomatic/socket-proxy
    note: "Only container that mounts the Docker socket; GET allowlist for Alloy's log discovery."
  - service: oauth2-proxy
    image: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.6
    spdx: MIT
    license: MIT
    usage: separate-service
    modified: false
    profile: sso
    source: https://github.com/oauth2-proxy/oauth2-proxy
  - service: postgres
    image: postgres
    tag: 17.11-alpine
    spdx: PostgreSQL
    license: PostgreSQL
    usage: separate-service
    modified: false
    source: https://www.postgresql.org/ftp/source/
  - service: langfuse-web
    image: langfuse/langfuse
    tag: 3.227.0
    spdx: MIT
    license: "MIT (EE dirs excluded, no license key)"
    usage: separate-service
    modified: false
    source: https://github.com/langfuse/langfuse
    note: "No LANGFUSE_EE_LICENSE_KEY variable: the 'ee' directories (commercial license) are not enabled."
  - service: langfuse-worker
    image: langfuse/langfuse-worker
    tag: 3.227.0
    spdx: MIT
    license: "MIT (EE dirs excluded, no license key)"
    usage: separate-service
    modified: false
    source: https://github.com/langfuse/langfuse
  - service: clickhouse
    image: clickhouse/clickhouse-server
    tag: 26.8.36.3
    spdx: Apache-2.0
    license: Apache-2.0
    usage: separate-service
    modified: false
    source: https://github.com/ClickHouse/ClickHouse
  - service: valkey
    image: valkey/valkey
    tag: 9.1.3-alpine
    spdx: BSD-3-Clause
    license: "BSD-3-Clause (replaces Redis ≥ 7.4, licensed under RSALv2/SSPLv1/AGPLv3)"
    usage: separate-service
    modified: false
    source: https://github.com/valkey-io/valkey
  - service: seaweedfs
    image: chrislusf/seaweedfs
    tag: "4.52"
    spdx: Apache-2.0
    license: "Apache-2.0 (S3 API, replaces MinIO, licensed under AGPLv3)"
    usage: separate-service
