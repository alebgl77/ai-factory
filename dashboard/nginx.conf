# SPDX-License-Identifier: MIT
# nginx for the static 3D dashboard (non-root, read-only root filesystem friendly).
# Security headers and TLS are set by the edge proxy (compose/caddy/Caddyfile); the few
# headers below are defence in depth for direct access.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration_s":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 16k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The API is routed by the edge proxy. Answer JSON here so that a direct access to
        # this container falls back cleanly to the embedded demo snapshot.
        location /api/ {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":"api not routed through this container"}';
        }

        # Vendored Three.js: version pinned at build time, safe to cache for a day.
        location /vendor/ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # SPA-safe: unknown paths serve the single page; real files are served as is.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
