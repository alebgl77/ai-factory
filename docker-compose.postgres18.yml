# Opt-in PostgreSQL 18 target. Restore a verified PostgreSQL 17 logical backup first.
# The original postgres-data volume is never attached to this target.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    volumes: !override
      - ./compose/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - postgres18-data:/var/lib/postgresql

volumes:
  postgres18-data:
