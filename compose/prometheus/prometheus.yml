# SPDX-License-Identifier: MIT
# Prometheus of the Virtual AI Factory (internal network only, never exposed).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    factory: ai-factory-reference

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Aggregation API: factory_usecase_*, factory_waste_alerts, factory_risk_*, factory_agent_* ...
  - job_name: factory-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # MIT custom callback of LiteLLM (compose/litellm/factory_callbacks.py): factory_llm_*.
  - job_name: litellm-callback
    static_configs:
      - targets: ["litellm:9464"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  # Local GPU telemetry, DCGM metric names. Docker DNS discovery: the target exists only
  # when the service runs (gpu-sim in profile "sim", dcgm-exporter in profile "local-gpu"),
  # so the inactive one never shows up as "down". A GPU host outside this compose project
  # (for instance a workstation reached over a VPN) is declared in targets/gpu-*.yml.
  - job_name: gpu
    scrape_interval: 10s
    dns_sd_configs:
      - names: ["gpu-sim", "dcgm-exporter"]
        type: A
        port: 9400
        refresh_interval: 30s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/gpu-*.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: gpu-sim
        target_label: gpu_source
        replacement: sim
      - source_labels: [__meta_dns_name]
        regex: dcgm-exporter
        target_label: gpu_source
        replacement: dcgm
      - source_labels: [gpu_source]
        regex: ""
        target_label: gpu_source
        replacement: dcgm-remote

  # Platform self-monitoring (separate, unmodified services).
  - job_name: platform
    static_configs:
      - targets: ["grafana:3000"]
        labels: { service: grafana }
      - targets: ["loki:3100"]
        labels: { service: loki }
      - targets: ["alloy:12345"]
        labels: { service: alloy }
