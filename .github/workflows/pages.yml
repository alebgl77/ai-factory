# SPDX-License-Identifier: MIT
# Live demo on GitHub Pages: the 3D dashboard in offline mode (embedded fictional snapshot,
# Three.js from jsDelivr). No API, no secret, nothing else is published.
# Least privilege: the build job only reads the repository; only the deploy job can write to
# Pages and mint the OIDC token that the Pages deployment requires.
name: pages

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the static demo
        run: |
          mkdir -p _site/assets
          cp dashboard/index.html _site/index.html
          cp dashboard/assets/assets.js _site/assets/assets.js
          cp -R dashboard/exercise _site/exercise
          cp -R dashboard/companion _site/companion
          # Static hosting: tell the page not to look for the aggregation API
          sed -i 's/<html /<html data-static-demo="1" /' _site/index.html
          sed -i 's/<html /<html data-static-demo="1" /' _site/companion/index.html
          grep -q 'data-static-demo="1"' _site/index.html
          grep -q 'data-static-demo="1"' _site/companion/index.html
          grep -q 'DEMO_SNAPSHOT_START' _site/index.html
      # actions/configure-pages is not used: it only configures static site generators, which this
      # plain HTML site does not have, and would need an extra Pages permission in this job.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the uploaded artifact
      id-token: write   # OIDC token required by the Pages deployment API
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
