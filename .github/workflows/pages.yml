# SPDX-License-Identifier: MIT
# Live demo on GitHub Pages: the 3D dashboard in offline mode (embedded fictional snapshot,
# same-origin Three.js) and the public operations guide. No API or secrets are published.
# Least privilege: the build job only reads the repository; only the deploy job can write to
# Pages and mint the OIDC token that the Pages deployment requires.
name: pages

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml", ".github/tools/e2e/package*.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the locked Three.js dependency
        run: npm ci --prefix .github/tools/e2e --ignore-scripts --no-audit --no-fund
      - name: Assemble the static demo
        run: |
          mkdir -p _site/assets
          cp dashboard/index.html _site/index.html
          cp dashboard/assets/assets.js _site/assets/assets.js
          cp dashboard/assets/camille-model.js dashboard/assets/portrait-atlases.js _site/assets/
          cp dashboard/assets/factory-character.js dashboard/assets/factory-encounters.js dashboard/assets/factory-workbench-follow.js dashboard/assets/factory-activity.js _site/assets/
          cp dashboard/assets/factory-demo-decision.js _site/assets/factory-demo-decision.js
          cp dashboard/assets/factory-portfolio.js _site/assets/factory-portfolio.js
          cp dashboard/assets/factory-assist.js _site/assets/factory-assist.js
          cp dashboard/assets/factory-ideas.js _site/assets/factory-ideas.js
          cp -R dashboard/exercise _site/exercise
          cp -R dashboard/companion _site/companion
          cp -R dashboard/docs _site/docs
          # Match the Docker distribution and keep all imports relative to the Pages project path.
          three=.github/tools/e2e/node_modules/three
          version=$(node -p 'require("./.github/tools/e2e/node_modules/three/package.json").version')
          vendor=_site/vendor/three
          mkdir -p "$vendor/build"
          cp "$three/LICENSE" "$vendor/"
          cp "$three/build/three.module.js" "$three/build/three.core.js" "$vendor/build/"
          for file in controls/OrbitControls.js renderers/CSS2DRenderer.js environments/RoomEnvironment.js \
                      geometries/RoundedBoxGeometry.js utils/BufferGeometryUtils.js \
                      postprocessing/GTAOPass.js postprocessing/Pass.js shaders/GTAOShader.js \
                      shaders/PoissonDenoiseShader.js shaders/CopyShader.js math/SimplexNoise.js; do
            mkdir -p "$vendor/examples/jsm/$(dirname "$file")"
            cp "$three/examples/jsm/$file" "$vendor/examples/jsm/$file"
          done
          sed -i "s#https://cdn.jsdelivr.net/npm/three@${version}/#./vendor/three/#g" _site/index.html
          grep -Fq '"three": "./vendor/three/build/three.module.js"' _site/index.html
          grep -Fq '"three/addons/": "./vendor/three/examples/jsm/"' _site/index.html
          # Static hosting: tell the page not to look for the aggregation API
          sed -i 's/<html /<html data-static-demo="1" /' _site/index.html
          sed -i 's/<html /<html data-static-demo="1" /' _site/companion/index.html
          grep -q 'data-static-demo="1"' _site/index.html
          grep -q 'data-static-demo="1"' _site/companion/index.html
          test -s _site/assets/factory-demo-decision.js
          grep -q 'DEMO_SNAPSHOT_START' _site/index.html
      # actions/configure-pages is not used: it only configures static site generators, which this
      # plain HTML site does not have, and would need an extra Pages permission in this job.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the uploaded artifact
      id-token: write   # OIDC token required by the Pages deployment API
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
