# SPDX-License-Identifier: MIT
# Release, on a semantic version tag pushed from the default branch (v1.2.3 or v1.2.3-rc.1):
#   1. preflight: the tag is a semantic version, its commit is on the default branch,
#      CHANGELOG.md has a section for it, and the latest CI, security and CodeQL push runs
#      for that exact commit succeeded;
#   2. for each image built from this repository (api, dashboard, mock-llm, traffic, gpu-sim,
#      grafana-bootstrap): build, Trivy gate (no known fixable HIGH/CRITICAL vulnerability, no
#      secret) BEFORE anything is pushed, push to ghcr.io/<owner>/<name>, SBOM (syft, SPDX and
#      CycloneDX), SLSA build provenance and SBOM attestations (actions/attest, stored by GitHub
#      and pushed to the registry), keyless cosign signature, then verification of all of it
#      with .github/scripts/verify_image.sh, the script users run;
#   3. GitHub release: notes from CHANGELOG.md, images pinned by digest, SBOMs and attestation
#      bundles as assets, a version-matched deployment bundle, SHA256SUMS signed keyless.
# Verify a release: see the release notes, or .github/scripts/verify_image.sh IMAGE@DIGEST.
# Images are built for linux/amd64 (the platform the SBOMs and the scan describe).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.76.1
  SYFT_VERSION: v1.55.0
  COSIGN_VERSION: v3.1.4
  PLATFORMS: linux/amd64

jobs:
  preflight:
    name: Preflight (tag, branch, changelog, checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      registry: ${{ steps.check.outputs.registry }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the default branch is needed to check where the tag points
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semantic version tag (v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          if ! release_sha=$(git rev-parse --verify "$GITHUB_SHA^{commit}"); then
            echo "::error::$TAG does not point to a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$TAG points to $release_sha, which is not on $DEFAULT_BRANCH"
            exit 1
          fi
          .github/scripts/changelog_section.sh "$TAG" > /dev/null
          for workflow in ci.yml security.yml codeql.yml; do
            if ! evidence=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch="$DEFAULT_BRANCH" -f event=push -f head_sha="$release_sha" -F per_page=1); then
              echo "::error::Unable to read $workflow runs for $release_sha"
              exit 1
            fi
            if ! jq -e --arg sha "$release_sha" --arg branch "$DEFAULT_BRANCH" '
              .workflow_runs[0] | .head_sha == $sha and .head_branch == $branch and
              .event == "push" and .status == "completed" and .conclusion == "success"
            ' <<< "$evidence" > /dev/null; then
              echo "::error::Latest $workflow push run for $release_sha on $DEFAULT_BRANCH is missing or unsuccessful"
              exit 1
            fi
          done
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "registry=ghcr.io/${OWNER,,}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      id-token: write          # OIDC identity for keyless signing and attestations
      attestations: write      # store the attestations in GitHub
      artifact-metadata: write # storage record of each attested image
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: api, context: api }
          - { image: dashboard, context: dashboard }
          - { image: mock-llm, context: sim/mock-llm }
          - { image: traffic, context: sim/traffic }
          - { image: gpu-sim, context: sim/gpu-sim }
          - { image: grafana-bootstrap, context: compose/grafana-bootstrap }
    env:
      NAME: ${{ matrix.image }}
      IMAGE: ${{ needs.preflight.outputs.registry }}/${{ matrix.image }}
      CANDIDATE: release-candidate/${{ matrix.image }}:${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ---- gate: nothing is pushed unless the image passes
      - name: Build (local candidate, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.CANDIDATE }}
      - name: Gate (fixable HIGH/CRITICAL vulnerabilities, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: "false" # no cache in the release workflow (cache poisoning)
          scan-type: image
          image-ref: ${{ env.CANDIDATE }}
          scanners: vuln,secret
          trivy-config: .github/trivy/trivy.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # ---- publish
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Virtual AI Factory ${{ matrix.image }}
            org.opencontainers.image.vendor=Digitalizor
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=Virtual AI Factory ${{ matrix.image }}
            org.opencontainers.image.vendor=Digitalizor
            org.opencontainers.image.licenses=MIT
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build and push (same builder and layers as the scanned candidate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false # provenance comes from actions/attest below (signed, verifiable)
          sbom: false       # SBOMs come from syft below (SPDX and CycloneDX, attested)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # ---- SBOMs of the pushed digest
      - name: SBOM output directory
        run: mkdir -p "$RUNNER_TEMP/release"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          syft-version: ${{ env.SYFT_VERSION }}
          format: spdx-json
          output-file: ${{ runner.temp }}/release/${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          syft-version: ${{ env.SYFT_VERSION }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/release/${{ matrix.image }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # ---- attestations (Sigstore-signed, stored by GitHub and pushed next to the image)
      - id: provenance
        name: Attest build provenance (SLSA v1)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: sbom-spdx
        name: Attest SBOM (SPDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release/${{ matrix.image }}.spdx.json
          push-to-registry: true
      - id: sbom-cdx
        name: Attest SBOM (CycloneDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release/${{ matrix.image }}.cdx.json
          push-to-registry: true

      # ---- keyless signature, then verification of everything that was published
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign (cosign keyless, Sigstore public-good instance)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify signature, provenance and SBOM attestations
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: .github/scripts/verify_image.sh "$IMAGE@$DIGEST"

      - name: Collect release assets
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SPDX_BUNDLE: ${{ steps.sbom-spdx.outputs.bundle-path }}
          CDX_BUNDLE: ${{ steps.sbom-cdx.outputs.bundle-path }}
        run: |
          out="$RUNNER_TEMP/release"
          cp "$PROVENANCE_BUNDLE" "$out/$NAME.provenance.sigstore.json"
          cp "$SPDX_BUNDLE" "$out/$NAME.spdx.sigstore.json"
          cp "$CDX_BUNDLE" "$out/$NAME.cdx.sigstore.json"
          echo "$IMAGE@$DIGEST" > "$out/$NAME.ref"
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub release
    needs: [preflight, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # OIDC identity to sign SHA256SUMS keyless
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install integrity-verified Helm
        run: |
          bash .github/scripts/install_kubernetes_tools.sh "$RUNNER_TEMP/kube-tools" helm
          echo "$RUNNER_TEMP/kube-tools" >> "$GITHUB_PATH"
      - name: Build the deployment bundle for this tag
        env:
          REGISTRY: ${{ needs.preflight.outputs.registry }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          bundle="$(mktemp -d)"
          staging="$(mktemp -d)"
          trap 'rm -rf "$bundle" "$staging"' EXIT
          mapfile -t archive_paths < .github/scripts/release_bundle.paths
          test "${#archive_paths[@]}" -gt 0
          git archive "$release_sha" -- "${archive_paths[@]}" | tar -x -C "$bundle"
          python3 .github/scripts/create_release_bundle.py "$bundle" "$RUNNER_TEMP/release" "$TAG" "$release_sha" "$REGISTRY"
          mkdir -p "$bundle/deploy/helm"
          python3 .github/scripts/create_release_bundle.py --helm-values "$bundle"
          python3 scripts/package_helm.py "$staging"
          helm lint --strict "$staging/ai-factory" -f "$bundle/deploy/helm/values.release.json"
          helm package "$staging/ai-factory" --version "${TAG#v}" --app-version "$TAG" --destination "$bundle/deploy/helm"
          python3 .github/scripts/create_release_bundle.py --check-docs "$bundle"
          tar -C "$bundle" -czf "$RUNNER_TEMP/release/ai-factory-deploy-$TAG.tar.gz" .
      - name: Image list and signed checksums
        working-directory: ${{ runner.temp }}/release
        env:
          REPO: ${{ github.repository }}
        run: |
          cat ./*.ref | sort > images.txt
          rm -f ./*.ref
          test "$(wc -l < images.txt)" -eq 6
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c SHA256SUMS
      - name: Release notes
        run: .github/scripts/release_notes.sh "$TAG" "$RUNNER_TEMP/release/images.txt" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Virtual AI Factory $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
