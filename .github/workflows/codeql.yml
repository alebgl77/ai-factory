# SPDX-License-Identifier: MIT
# Static application security testing with CodeQL (security-extended query suite):
#   - python: aggregation API, simulators, scripts, LiteLLM callback;
#   - javascript-typescript: 3D dashboard (scripts inside index.html) and e2e tests;
#   - actions: the GitHub Actions workflows of this repository.
# Results go to the Security tab (code scanning). No build is needed (build-mode: none).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC: new queries find old code
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read          # workflow metadata used by the analysis
      contents: read         # read the code
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - integrations
              - node_modules
              - dashboard/vendor
              - dashboard/assets/assets.js
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
