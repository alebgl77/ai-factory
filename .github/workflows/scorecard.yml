# SPDX-License-Identifier: MIT
# OpenSSF Scorecard: automated assessment of the repository's security practices (pinned
# dependencies, token permissions, branch protection, signed releases, SAST, dangerous
# workflows...). Results are published to the public Scorecard API (badge) and to code scanning.
# The Scorecard API only accepts results from a workflow without top-level env, defaults or write
# permissions, whose job runs only approved actions: keep this file minimal.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2" # weekly, Tuesday 05:41 UTC
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read         # read the code (pinned dependencies, dangerous workflows...)
      actions: read          # workflow runs (CI-Tests check)
      checks: read           # check runs (CI-Tests check)
      issues: read           # issue metadata (Maintained check)
      pull-requests: read    # reviews (Code-Review check)
      security-events: write # upload the SARIF to code scanning
      id-token: write        # prove the results come from this workflow (publish_results)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
