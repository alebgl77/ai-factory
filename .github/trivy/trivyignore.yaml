# SPDX-License-Identifier: MIT
# Accepted findings of Trivy. Every entry states why it is accepted and expires: an expired
# entry is reported again and must be re-assessed. CI gates filter out vulnerabilities without a
# fixed version. Those findings remain in the full image vulnerability artifacts and the
# repository scan's Code Scanning report, depending on where they were detected.
misconfigurations:
  - id: DS-0026
    paths:
      - compose/grafana-bootstrap/Dockerfile
    statement: >-
      One-shot job (restart "no") that writes the Grafana Viewer token and exits; docker compose
      waits for its exit code, so a HEALTHCHECK has nothing to probe.
    expired_at: 2027-11-01
