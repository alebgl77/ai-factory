name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Live demo (GitHub Pages), Codespaces, Local Docker stack, Dashboard opened as a file, API, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, screenshots, console output. Never paste secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
