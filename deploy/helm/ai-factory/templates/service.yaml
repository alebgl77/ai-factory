apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-factory.fullname" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-factory.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: 8080
      targetPort: web
      protocol: TCP
